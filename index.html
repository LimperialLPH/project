<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ប្រព័ន្ធគ្រប់គ្រងការដ្ឋាន</title>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 15px; padding-bottom: 30px; display: flex; justify-content: center; }
    .container { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; position: relative; }
    
    /* Top Navigation Tabs Switcher */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #ebf5fb; padding: 5px; border-radius: 10px; }
    .tab-btn { flex: 1; padding: 10px 5px; border: none; background: transparent; font-weight: 700; font-size: 13px; color: #1a5276; border-radius: 8px; cursor: pointer; transition: 0.2s; text-align: center; }
    .tab-btn.active { background: #3498db; color: #ffffff; box-shadow: 0 2px 6px rgba(52,152,219,0.3); }

    h2 { text-align: center; color: #1a5276; margin-bottom: 20px; font-size: 20px; }
    .form-group { margin-bottom: 15px; position: relative; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #2c3e50; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #3498db; }

    .photo-btn {
      display: block; width: 100%; padding: 12px; border-radius: 8px; border: 1px dashed #3498db;
      background: #ebf5fb; text-align: center; cursor: pointer; font-size: 14px;
      font-weight: 600; color: #2980b9; transition: 0.2s; margin-top: 6px;
    }
    .photo-btn input { display: none; }

    .btn-submit { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    .btn-submit:disabled { background-color: #bdc3c7; }
    .btn-location { background-color: #2980b9; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; margin-top: 6px; width: 100%; font-weight: 600; }
    
    .preview-container {
      display: none; margin-top: 10px; text-align: center; background: #f8f9fa; padding: 8px; border-radius: 8px; border: 1px solid #e2e8f0;
    }
    .preview-container img { max-width: 100%; max-height: 180px; border-radius: 6px; object-fit: cover; }
    .preview-text { font-size: 12px; color: #27ae60; margin-top: 4px; font-weight: 600; }

    /* Success Card */
    .success-card { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; cursor: pointer; }
    .success-icon { font-size: 64px; color: #27ae60; margin-bottom: 15px; }
    .success-title { font-size: 22px; font-weight: 700; color: #27ae60; margin-bottom: 10px; }
    .success-sub { font-size: 14px; color: #7f8c8d; margin-top: 15px; }

    /* Existing Site Platform Styles */
    .site-card { display: flex; align-items: center; gap: 12px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .site-card:hover { background-color: #f8fbfe; border-color: #3498db; }
    .site-thumb { width: 65px; height: 65px; border-radius: 8px; object-fit: cover; background: #e2e8f0; flex-shrink: 0; }
    .site-info { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
    .site-title { font-weight: 700; font-size: 14px; color: #1a5276; margin-bottom: 2px; }
    .site-sub { font-size: 12px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .site-badge { display: inline-block; background: #e8f8f5; color: #16a085; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; align-self: flex-start; }

    /* Site Detail Overlay View */
    .detail-view { display: none; }
    .detail-header { border-bottom: 2px solid #f4f7f6; padding-bottom: 12px; margin-bottom: 15px; }
    .detail-header-top { display: flex; align-items: center; justify-content: space-between; }
    .detail-header-meta { margin-top: 6px; font-size: 13px; color: #34495e; line-height: 1.5; }
    .back-btn { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; }
    
    /* Visit Box Layout */
    .visit-box { background: #f8fbfe; border: 1px solid #d4e6f1; border-radius: 10px; padding: 12px; margin-bottom: 15px; position: relative; }
    .visit-title { font-weight: 700; color: #1a5276; font-size: 15px; border-bottom: 1px solid #d4e6f1; padding-bottom: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .visit-time { font-weight: 600; color: #7f8c8d; font-size: 12px; white-space: nowrap; }
    .visit-content { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; }
    .visit-details { flex-grow: 1; font-size: 13px; color: #333; }
    .detail-row { margin-bottom: 5px; }
    .detail-label { font-weight: 600; color: #2c3e50; }
    
    /* Image aligned top-right in visit box */
    .visit-right-img { width: 100px; height: 120px; border-radius: 8px; object-fit: cover; border: 1px solid #d4e6f1; background: #e2e8f0; flex-shrink: 0; }

    /* Sticky Bottom Button for Existing Site Detail */
    .sticky-bottom-btn { position: sticky; bottom: 0; background: #ffffff; padding: 10px 0 0 0; border-top: 1px solid #eee; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Switcher Platform Tabs -->
  <div class="nav-tabs">
    <button type="button" id="tabNew" class="tab-btn active" onclick="switchTab('NEW')">បញ្ចូលការដ្ឋានថ្មី</button>
    <button type="button" id="tabExisting" class="tab-btn" onclick="switchTab('EXISTING')">ការដ្ឋានមានស្រាប់</button>
  </div>

  <!-- Success Screen Notice -->
  <div id="successNotice" class="success-card" onclick="resetFormToInput()">
    <div class="success-icon">✅</div>
    <div class="success-title">បានបញ្ជូនរួចរាល់</div>
    <button type="button" class="btn-submit" style="width: auto; padding: 10px 24px;">បញ្ចូលទិន្នន័យបន្ថែមទៀត</button>
    <div class="success-sub">(ចុចទីនេះ ឬប៉ះលើអេក្រង់ដើម្បីបញ្ចូលបន្ត)</div>
  </div>

  <!-- PLATFORM 1: New Site Form -->
  <div id="formContainer">
    <h2 id="formHeaderTitle">បញ្ចូលការដ្ឋានថ្មី</h2>

    <form id="sourcingForm">
      <input type="hidden" id="siteNo" value="">

      <!-- Project Name -->
      <div class="form-group">
        <label for="projectName">ឈ្មោះគម្រោង (Project Name) *</label>
        <input type="text" id="projectName" required placeholder="បញ្ចូលឈ្មោះគម្រោង">
      </div>

      <!-- Address / Area -->
      <div class="form-group">
        <label for="address">អាសយដ្ឋាន/ខណ្ឌ/តំបន់ (Address / District / Area)</label>
        <input type="text" id="address" placeholder="ឧទាហរណ៍៖ ខណ្ឌទួលគោក, ភ្នំពេញ">
      </div>

      <!-- Contact Person -->
      <div class="form-group">
        <label for="contactPerson">អ្នកទាក់ទង (Contact Person)</label>
        <input type="text" id="contactPerson" placeholder="បញ្ចូលឈ្មោះអ្នកទាក់ទង">
      </div>

      <!-- Contact Number -->
      <div class="form-group">
        <label for="contact">លេខទូរស័ព្ទ (Contact)</label>
        <input type="text" id="contact" placeholder="បញ្ចូលលេខទូរស័ព្ទ">
      </div>

      <!-- Sale Person -->
      <div class="form-group">
        <label for="salePerson">អ្នកលក់ (Sale Person)</label>
        <input type="text" id="salePerson" placeholder="បញ្ចូលឈ្មោះអ្នកលក់">
      </div>

      <!-- Check-in Map Link -->
      <div class="form-group">
        <label for="checkInMap">តំណភ្ជាប់ទីតាំង (Check in Map Link)</label>
        <input type="url" id="checkInMap" placeholder="https://maps.google.com/...">
        <button type="button" id="locBtn" class="btn-location" onclick="getGPSLocation()">📍 ស្វែងរកទីតាំងបច្ចុប្បន្ន (Get Current Location)</button>
      </div>

      <!-- Site Status % -->
      <div class="form-group">
        <label for="siteStatus">ស្ថានភាពការដ្ឋាន (%) (Site Status %)</label>
        <input type="number" id="siteStatus" min="0" max="100" placeholder="ឧទាហរណ៍៖ 50">
      </div>

      <!-- Stage Section -->
      <div class="form-group">
        <label for="stage">ដំណាក់កាល (Stage)</label>
        <select id="stage">
          <option value="">-- ជ្រើសរើសដំណាក់កាល (Select Stage) --</option>
          <option value="Draft">Draft</option>
          <option value="Contacting">Contacting</option>
          <option value="Potential">Potential</option>
          <option value="Potentials">Potentials</option>
          <option value="Close Deal">Close Deal</option>
          <option value="Waiting Decision">Waiting Decision</option>
          <option value="Reject">Reject</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <!-- Remark -->
      <div class="form-group">
        <label for="remark">ចំណាំ (Remark)</label>
        <textarea id="remark" rows="3" placeholder="ព័ត៌មានបន្ថែម..."></textarea>
      </div>

      <!-- Single Photo Upload Option -->
      <div class="form-group">
        <label>រូបថតការដ្ឋាន (Site Picture)</label>
        <label class="photo-btn">
          📁 ជ្រើសរើសរូបថត ឬថតរូប (Upload Photo / Take Picture)
          <input type="file" id="fileUpload" accept="image/*" onchange="handleFileSelected()">
        </label>
        <div id="previewContainer" class="preview-container">
          <img id="imagePreview" src="#" alt="Selected Photo Preview">
          <div id="photoPreview" class="preview-text">✓ រូបថតត្រូវបានជ្រើសរើស (Photo Selected)</div>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">រក្សាទុកទិន្នន័យ (Submit)</button>
    </form>
  </div>

  <!-- PLATFORM 2: Existing Sites List View -->
  <div id="existingContainer" style="display: none;">
    <h2>ការដ្ឋានមានស្រាប់</h2>
    <div class="form-group">
      <input type="text" id="searchExisting" placeholder="🔍 វាយស្វែងរកឈ្មោះ ឬលេខ No..." oninput="filterExistingSites()">
    </div>
    <div id="loadingText" style="text-align: center; color: #3498db; margin: 15px 0;">កំពុងទាញយកទិន្នន័យ...</div>
    <div id="existingList"></div>
  </div>

  <!-- Existing Site History Detail View -->
  <div id="detailView" class="detail-view">
    <div class="detail-header">
      <div class="detail-header-top">
        <h3 id="detailSiteTitle" style="margin: 0; color: #1a5276; font-size: 16px;">ព័ត៌មានលម្អិតការដ្ឋាន</h3>
        <button type="button" class="back-btn" onclick="closeSiteDetail()">ត្រឡប់ក្រោយ</button>
      </div>
      <!-- Area and Map Link placed right below No. Title -->
      <div class="detail-header-meta">
        <div>📍 <span class="detail-label">អាសយដ្ឋាន/តំបន់:</span> <span id="detailHeaderArea">-</span></div>
        <div id="detailHeaderMapContainer" style="margin-top: 3px;">🗺️ <span class="detail-label">ទីតាំង Map:</span> <a id="detailHeaderMapLink" href="#" target="_blank">មើលលើ Google Maps</a></div>
      </div>
    </div>
    
    <div id="visitsTimeline"></div>

    <div class="sticky-bottom-btn">
      <button type="button" class="btn-submit" onclick="prepareNewVisitEntry()">បញ្ចូលទិន្នន័យ</button>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLc7ezpsK4kPxBBWKknonrGRedXKw4JNhrBkRAqYysSk7EEfB-5ssRFI5eyqMXice0/exec"; 
  let selectedFile = null;
  let rawSheetData = [];
  let groupedSites = {};
  let currentActiveSiteNo = null;

  window.onload = function() {
    loadExistingSitesData();
  };

  function switchTab(tab) {
    document.getElementById('successNotice').style.display = 'none';
    document.getElementById('detailView').style.display = 'none';

    if (tab === 'NEW') {
      document.getElementById('tabNew').classList.add('active');
      document.getElementById('tabExisting').classList.remove('active');
      document.getElementById('formContainer').style.display = 'block';
      document.getElementById('existingContainer').style.display = 'none';
      
      document.getElementById('formHeaderTitle').textContent = 'បញ្ចូលការដ្ឋានថ្មី';
      document.getElementById('siteNo').value = '';
      document.getElementById('sourcingForm').reset();
      resetPhotoInputs();
    } else {
      document.getElementById('tabExisting').classList.add('active');
      document.getElementById('tabNew').classList.remove('active');
      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('existingContainer').style.display = 'block';
      loadExistingSitesData();
    }
  }

  function normalizeSiteStatus(val) {
    if (val === null || val === undefined || val === '') return null;
    let num = parseFloat(String(val).replace('%', '').trim());
    if (isNaN(num)) return null;
    // Google Sheets exports percent-formatted cells as a decimal fraction (e.g. 0.5 instead of 50)
    if (num > 0 && num <= 1) num = num * 100;
    return Math.round(num);
  }

  function formatGoogleDriveUrl(url) {
    if (!url) return '';
    // If it's already a thumbnail format or non-drive link, return it directly
    if (url.includes('drive.google.com/thumbnail')) return url;
    
    let fileId = '';
    const matchD = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    const matchId = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (matchD && matchD[1]) fileId = matchD[1];
    else if (matchId && matchId[1]) fileId = matchId[1];
    
    return fileId ? `https://drive.google.com/thumbnail?sz=w1000&id=${fileId}` : url;
  }

  function loadExistingSitesData() {
    document.getElementById('loadingText').style.display = 'block';
    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        rawSheetData = data.projects || [];
        processAndGroupData(rawSheetData);
        renderExistingList();
        document.getElementById('loadingText').style.display = 'none';
      })
      .catch(err => {
        console.error(err);
        document.getElementById('loadingText').textContent = 'មានបញ្ហាក្នុងការទាញយកទិន្នន័យ!';
      });
  }

  function processAndGroupData(items) {
    groupedSites = {};
    items.forEach(item => {
      const no = item.no;
      if (!no) return;
      if (!groupedSites[no]) {
        groupedSites[no] = [];
      }
      groupedSites[no].push(item);
    });
  }

  function renderExistingList() {
    const listContainer = document.getElementById('existingList');
    listContainer.innerHTML = '';
    
    const query = document.getElementById('searchExisting').value.toLowerCase().trim();

    Object.keys(groupedSites).forEach(no => {
      const visits = groupedSites[no];
      const latest = visits[visits.length - 1];
      
      const pName = latest.projectName || 'គ្មានឈ្មោះ';
      const cPerson = latest.contactPerson || 'គ្មានអ្នកទាក់ទង';
      const addr = latest.address || 'គ្មានអាសយដ្ឋាន';
      
      if (query && !pName.toLowerCase().includes(query) && !String(no).includes(query) && !cPerson.toLowerCase().includes(query)) {
        return;
      }

      const imgRaw = latest.siteImage || '';
      const imgUrl = formatGoogleDriveUrl(imgRaw) || 'https://via.placeholder.com/65?text=No+Img';

      const card = document.createElement('div');
      card.className = 'site-card';
      card.onclick = () => openSiteDetail(no);
      card.innerHTML = `
        <img class="site-thumb" src="${imgUrl}" onerror="this.onerror=null;this.src='https://via.placeholder.com/65?text=No+Img';">
        <div class="site-info">
          <span class="site-title">No. ${no} - ${pName}</span>
          <span class="site-sub">👤 ${cPerson}</span>
          <span class="site-sub">📍 ${addr}</span>
          <span class="site-badge">ចំនួនមកដល់: ${visits.length} លើក</span>
        </div>
      `;
      listContainer.appendChild(card);
    });
  }

  function filterExistingSites() {
    renderExistingList();
  }

  function openSiteDetail(no) {
    currentActiveSiteNo = no;
    const visits = groupedSites[no] || [];
    const latest = visits[visits.length - 1] || {};

    document.getElementById('existingContainer').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    
    // Set Header Info
    document.getElementById('detailSiteTitle').textContent = `No. ${no} - ${latest.projectName || ''}`;
    document.getElementById('detailHeaderArea').textContent = latest.address || '-';
    
    const mapContainer = document.getElementById('detailHeaderMapContainer');
    const mapLink = document.getElementById('detailHeaderMapLink');
    if (latest.checkInMap) {
      mapLink.href = latest.checkInMap;
      mapContainer.style.display = 'block';
    } else {
      mapContainer.style.display = 'none';
    }

    const timelineContainer = document.getElementById('visitsTimeline');
    timelineContainer.innerHTML = '';

    visits.forEach((v, idx) => {
      const box = document.createElement('div');
      box.className = 'visit-box';
      
      const imgFormatted = formatGoogleDriveUrl(v.siteImage);
      const imgHtml = imgFormatted ? `<img class="visit-right-img" src="${imgFormatted}" onerror="this.onerror=null;this.src='https://via.placeholder.com/100x120?text=No+Img';">` : `<div class="visit-right-img" style="display:flex;align-items:center;justify-content:center;color:#888;font-size:11px;">គ្មានរូប</div>`;

      box.innerHTML = `
        <div class="visit-title"><span>លើកទី ${idx + 1}</span>${v.visitTime ? `<span class="visit-time">🕒 ${v.visitTime}</span>` : ''}</div>
        <div class="visit-content">
          <div class="visit-details">
            <div class="detail-row"><span class="detail-label">ឈ្មោះគម្រោង:</span> ${v.projectName || '-'}</div>
            <div class="detail-row"><span class="detail-label">អ្នកទាក់ទង:</span> ${v.contactPerson || '-'} (${v.contact || '-'})</div>
            <div class="detail-row"><span class="detail-label">អ្នកលក់:</span> ${v.salePerson || '-'}</div>
            <div class="detail-row"><span class="detail-label">ស្ថានភាព (%):</span> ${normalizeSiteStatus(v.siteStatus) !== null ? normalizeSiteStatus(v.siteStatus) + '%' : '-'}</div>
            <div class="detail-row"><span class="detail-label">ដំណាក់កាល:</span> ${v.stage || '-'}</div>
            <div class="detail-row"><span class="detail-label">ចំណាំ:</span> ${v.remark || '-'}</div>
          </div>
          ${imgHtml}
        </div>
      `;
      timelineContainer.appendChild(box);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closeSiteDetail() {
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('existingContainer').style.display = 'block';
  }

  function prepareNewVisitEntry() {
    const visits = groupedSites[currentActiveSiteNo] || [];
    const latest = visits[visits.length - 1] || {};

    document.getElementById('detailView').style.display = 'none';
    document.getElementById('formContainer').style.display = 'block';

    document.getElementById('formHeaderTitle').textContent = `បញ្ចូលទិន្នន័យ (No. ${currentActiveSiteNo})`;
    document.getElementById('siteNo').value = currentActiveSiteNo;
    document.getElementById('projectName').value = latest.projectName || '';
    document.getElementById('address').value = latest.address || '';
    document.getElementById('contactPerson').value = latest.contactPerson || '';
    document.getElementById('contact').value = latest.contact || '';
    document.getElementById('salePerson').value = latest.salePerson || '';
    document.getElementById('checkInMap').value = latest.checkInMap || '';
    
    const cleanStatus = normalizeSiteStatus(latest.siteStatus);
    document.getElementById('siteStatus').value = cleanStatus !== null ? cleanStatus : '';
    
    document.getElementById('stage').value = latest.stage || '';
    document.getElementById('remark').value = latest.remark || '';

    if (latest.siteImage) {
      const formattedImg = formatGoogleDriveUrl(latest.siteImage);
      document.getElementById('imagePreview').src = formattedImg;
      document.getElementById('photoPreview').textContent = '✓ រូបថតចាស់ត្រូវបានប្រើប្រាស់';
      document.getElementById('previewContainer').style.display = 'block';
    } else {
      resetPhotoInputs();
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function handleFileSelected() {
    const fileInput = document.getElementById('fileUpload');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const previewText = document.getElementById('photoPreview');

    if (fileInput.files && fileInput.files[0]) {
      selectedFile = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        imagePreview.src = e.target.result;
        previewText.textContent = `✓ ${selectedFile.name}`;
        previewContainer.style.display = 'block';
      };
      reader.readAsDataURL(selectedFile);
    }
  }

  function resetPhotoInputs() {
    document.getElementById('fileUpload').value = '';
    document.getElementById('previewContainer').style.display = 'none';
    document.getElementById('imagePreview').src = '#';
    selectedFile = null;
  }

  function resetFormToInput() {
    switchTab('NEW');
  }

  function getGPSLocation() {
    const btn = document.getElementById('locBtn');
    if (!navigator.geolocation) {
      alert("កម្មវិធីរុករកនេះមិនគាំទ្រការទាញយកទីតាំងឡើយ");
      return;
    }

    btn.textContent = "កំពុងទាញយកទីតាំង...";
    btn.disabled = true;

    navigator.geolocation.getCurrentPosition(
      function(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        document.getElementById('checkInMap').value = `https://maps.google.com/?q=${lat},${lng}`;
        btn.textContent = "📍 ស្វែងរកទីតាំងបច្ចុប្បន្ន (Get Current Location)";
        btn.disabled = false;
        alert("ទទួលបានទីតាំងជោគជ័យ!");
      }, 
      function(error) {
        btn.textContent = "📍 ស្វែងរកទីតាំងបច្ចុប្បន្ន (Get Current Location)";
        btn.disabled = false;
        alert("មានបញ្ហាក្នុងការទាញយកទីតាំង");
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  document.getElementById('sourcingForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = "កំពុងរក្សាទុក... (Saving...)";

    const payload = {
      no: document.getElementById('siteNo').value || null,
      projectName: document.getElementById('projectName').value,
      address: document.getElementById('address').value,
      contactPerson: document.getElementById('contactPerson').value,
      contact: document.getElementById('contact').value,
      salePerson: document.getElementById('salePerson').value,
      checkInMap: document.getElementById('checkInMap').value,
      siteStatus: document.getElementById('siteStatus').value,
      stage: document.getElementById('stage').value,
      remark: document.getElementById('remark').value,
      imageData: null,
      visitTime: new Date().toLocaleString('en-GB', { timeZone: 'Asia/Phnom_Penh' })
    };

    if (selectedFile) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        payload.imageData = evt.target.result;
        sendData(payload);
      };
      reader.readAsDataURL(selectedFile);
    } else {
      sendData(payload);
    }
  });

  function sendData(payload) {
    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('successNotice').style.display = 'flex';
    })
    .catch(err => {
      alert("មានបញ្ហាក្នុងការរក្សាទុកទិន្នន័យ!");
      console.error(err);
    })
    .finally(() => {
      const btn = document.getElementById('submitBtn');
      btn.disabled = false;
      btn.textContent = "រក្សាទុកទិន្នន័យ (Submit)";
    });
  }
</script>

</body>
</html>
